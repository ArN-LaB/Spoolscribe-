[project]
name = "spoolscribe"
version = "0.8.3"
description = "Desktop filament catalogue with multilingual UI, OpenSpool and OpenTag3D NFC exports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ArN-LaB" }]
keywords = ["3d-printing", "filament", "nfc", "rfid", "openspool", "snapmaker", "polymaker"]
dependencies = [
    "PySide6>=6.6,<6.12",
    "segno>=1.6.6,<1.7",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0,<7", "Pillow>=10.0", "certifi>=2026.10.23"]
dev   = ["Pillow>=10.0", "certifi>=2026.10.23"]

[project.urls]
Homepage = "https://github.com/ArN-LaB/Spoolscribe-"
Repository = "https://github.com/ArN-LaB/Spoolscribe-"
Issues = "https://github.com/ArN-LaB/Spoolscribe-/issues"
Changelog = "https://github.com/ArN-LaB/Spoolscribe-/blob/main/CHANGELOG.md"

[project.scripts]
spoolscribe-cli = "spoolscribe.convert_profile:main"

[project.gui-scripts]
spoolscribe = "spoolscribe.app_gui:main"

# Source installations are editable checkouts; standalone apps use PyInstaller.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spoolscribe", "scripts"]
package-dir = {spoolscribe = "src/spoolscribe", scripts = "scripts"}
