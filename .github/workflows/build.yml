name: Build multiplatform

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:        # build manuel depuis l'onglet Actions

permissions:
  contents: read

# Un seul run par branche : un nouveau push annule le précédent (hors tags).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    name: Tests ${{ matrix.os }} / Python ${{ matrix.python }}
    # Les PR internes sont déjà testées par le push de leur branche ; seules les
    # PR venant d'un fork passent par l'événement pull_request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
      - name: Install GUI dependencies
        run: |
          python -m pip install -c requirements/requirements-build.txt "PySide6>=6.6,<6.12" "segno>=1.6.6,<1.7" "certifi>=2026.10.23" "Pillow>=10.0"
          python -c "import sys, PySide6, shiboken6, segno; print(sys.version); print('PySide6', PySide6.__version__, 'Shiboken6', shiboken6.__version__, 'Segno', segno.__version__)"
      - name: Record native Qt font metrics
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from PySide6.QtGui import QFontInfo, QFontMetrics; from spoolscribe.app_gui import configure_application; a=QApplication([]); print('Before:', a.font().toString(), QFontInfo(a.font()).family()); configure_application(a); f=a.font(); f.setPixelSize(13); print('Configured:', f.toString(), QFontInfo(f).family(), 'Fabricants:', QFontMetrics(f).horizontalAdvance('Fabricants'), 'DPI:', a.primaryScreen().logicalDotsPerInch(), 'DPR:', a.primaryScreen().devicePixelRatio())"
      - name: Offline documentation and layout checks
        run: python .github/scripts/check_repository.py

      - name: Offline business and GUI tests
        run: python -B -m unittest discover -s tests -t . -v
      - name: Check version metadata
        shell: python
        run: |
          import ast, pathlib, re
          tree = ast.parse(pathlib.Path('src/spoolscribe/core.py').read_text(encoding='utf-8'))
          version = next(n.value.value for n in tree.body if isinstance(n, ast.Assign)
                         and any(isinstance(t, ast.Name) and t.id == 'APP_VERSION' for t in n.targets))
          project = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          assert re.search(r'^version = "' + re.escape(version) + r'"$', project, re.M), 'Version mismatch'

  # Garde-fou : sur un tag vX.Y.Z, on vérifie que le tag correspond bien à
  # core.APP_VERSION (source unique de vérité). Évite les releases accidentelles
  # ou désynchronisées — la cause de l'ancienne release "sync version" inutile.
  verify:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag == core.APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CORE=$(python -c "import re,io; s=open('src/spoolscribe/core.py',encoding='utf-8').read(); print(re.search(r'APP_VERSION\s*=\s*[\"\x27]([^\"\x27]+)', s).group(1))")
          echo "tag=$TAG  core.APP_VERSION=$CORE"
          if [ "$TAG" != "$CORE" ]; then
            echo "::error::Tag v$TAG does not match core.APP_VERSION ($CORE). Bump core.py and re-tag."
            exit 1
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: [verify, tests]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SpoolScribe-windows
          - os: macos-latest
            artifact: SpoolScribe-macos
          - os: ubuntu-latest
            artifact: SpoolScribe-linux

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller packaging/spoolscribe.spec --noconfirm

      - name: Check frozen TLS trust offline
        run: python .github/scripts/check_frozen_tls.py

      - name: Check frozen catalogue and NFC profiles offline
        run: python .github/scripts/check_frozen_catalogue.py

      - name: Check frozen colour measurements offline
        run: python .github/scripts/check_frozen_measurements.py

      # Install scan oracles AFTER packaging: they must never enter the executable.
      - name: Install CI-only QR scan oracles
        run: python -m pip install "Pillow>=10.0" "zxing-cpp==2.3.0"

      - name: Check frozen SSQR1 screen and digital files offline
        env:
          QT_QPA_PLATFORM: offscreen
        run: python .github/scripts/check_frozen_ssqr1.py

      - name: Verify bundled resources against Git
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          sys.path.insert(0, str(pathlib.Path.cwd()))  # shell: python runs a script in RUNNER_TEMP
          from spoolscribe.packaging_rules import include_resource
          tracked = subprocess.check_output(['git', 'ls-files', '-z', '--', 'data', 'scripts'])
          expected = {name: subprocess.check_output(['git', 'show', 'HEAD:' + name])
                      for name in tracked.decode('utf-8').split(chr(0)) if name and include_resource(name)}
          if sys.platform == 'darwin':
              # macOS onedir: DATA lives in Resources; Frameworks links to it.
              # rglob on Frameworks does not descend through those symlinks.
              base = pathlib.Path('dist/SpoolScribe.app/Contents/Resources')
              actual = {p.relative_to(base).as_posix() for p in base.rglob('*') if p.is_file()
                        and p.relative_to(base).parts[0] in ('data', 'scripts')}
              read = lambda name: (base / name).read_bytes()
          else:
              from PyInstaller.archive.readers import CArchiveReader
              binary = pathlib.Path('dist') / ('SpoolScribe.exe' if os.name == 'nt' else 'SpoolScribe')
              reader = CArchiveReader(str(binary))
              names = {name.replace('\\', '/'): name for name in reader.toc}
              actual = {name for name in names if name.startswith(('data/', 'scripts/'))}
              read = lambda name: reader.extract(names[name])
          assert actual == set(expected), f'Unexpected or missing bundled resources: {sorted(actual ^ set(expected))[:10]}'
          for name, raw in expected.items():
              assert pathlib.Path(name).read_bytes() == raw, f'Checkout changed bytes: {name}'
              assert read(name) == raw, f'Bundle changed bytes: {name}'
          print(f'Verified {len(expected)} bundled resources against HEAD')

      - name: Package artifact (zip + SHA256)
        shell: bash
        run: |
          cd dist
          case "$RUNNER_OS" in
            macOS) target="SpoolScribe.app" ;;
            Windows) target="SpoolScribe.exe" ;;
            Linux) target="SpoolScribe" ;;
            *) exit 1 ;;
          esac
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Le .app contient des liens symboliques (frameworks Qt) : ditto les
            # conserve et garde la signature du bundle intacte ; zip -r les copierait.
            ditto -c -k --norsrc --noextattr --keepParent "$target" "../${{ matrix.artifact }}.zip"
          else
            7z a "../${{ matrix.artifact }}.zip" "$target" >/dev/null 2>&1 || zip -r "../${{ matrix.artifact }}.zip" "$target"
          fi
          cd ..
          python .github/scripts/verify_archive.py "${{ matrix.artifact }}.zip"
          # Empreinte SHA256 pour que les utilisateurs vérifient l'intégrité.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}.zip" > "${{ matrix.artifact }}.zip.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}.zip" > "${{ matrix.artifact }}.zip.sha256"
          fi
          cat "${{ matrix.artifact }}.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      # v0.4.0 through v0.8.0 are explicitly authorised as pre-releases. Suffixed tags are
      # pre-releases too; neither may replace the latest stable download.
      RELEASE_PRERELEASE: ${{ github.ref_name == 'v0.4.0' || github.ref_name == 'v0.5.0' || github.ref_name == 'v0.6.0' || github.ref_name == 'v0.7.0' || github.ref_name == 'v0.8.0' || contains(github.ref_name, '-') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Verify all three archives and checksums
        shell: python
        run: |
          import hashlib, pathlib, subprocess, sys
          root = pathlib.Path('artifacts')
          expected = {f'SpoolScribe-{os}.zip{suffix}'
                      for os in ('windows', 'macos', 'linux') for suffix in ('', '.sha256')}
          files = [p for p in root.rglob('*') if p.is_file()]
          assert len(files) == 6 and {p.name for p in files} == expected, 'Incomplete release assets'
          for archive in root.rglob('*.zip'):
              checksum = archive.with_name(archive.name + '.sha256')
              digest, filename = checksum.read_text().strip().split()
              assert filename.lstrip('*') == archive.name, checksum
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == digest, archive
              subprocess.run([sys.executable, '.github/scripts/verify_archive.py', str(archive)], check=True)

      - name: Upload complete draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ env.RELEASE_PRERELEASE == 'true' }}
          make_latest: ${{ env.RELEASE_PRERELEASE != 'true' }}
          fail_on_unmatched_files: true
          body: |
            ${{ steps.changelog.outputs.body }}

            Automated tests and platform builds: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.zip.sha256

      - name: Verify uploaded assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, tempfile
          expected = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in pathlib.Path('artifacts').rglob('*') if p.is_file()}
          assert len(expected) == 6, 'Incomplete local release assets'
          tag, repo = os.environ['GITHUB_REF_NAME'], os.environ['GITHUB_REPOSITORY']
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run(['gh', 'release', 'download', tag, '--repo', repo, '--dir', directory], check=True)
              actual = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in pathlib.Path(directory).iterdir() if p.is_file()}
              assert actual == expected, 'Uploaded release assets differ from verified build artifacts'
          channel = os.environ['RELEASE_PRERELEASE']
          assert channel in ('true', 'false'), 'Invalid release channel'
          prerelease = channel == 'true'
          subprocess.run(['gh', 'release', 'edit', tag, '--repo', repo, '--draft=false',
                          '--prerelease=' + str(prerelease).lower(),
                          '--latest=' + str(not prerelease).lower()], check=True)
          published = json.loads(subprocess.check_output(
              ['gh', 'release', 'view', tag, '--repo', repo, '--json', 'isDraft,isPrerelease,tagName'], text=True))
          assert published == {'isDraft': False, 'isPrerelease': prerelease, 'tagName': tag}, 'Wrong release channel'
