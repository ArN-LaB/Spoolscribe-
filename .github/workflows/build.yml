name: Build multiplatform

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:        # build manuel depuis l'onglet Actions

permissions:
  contents: read

jobs:
  tests:
    name: Tests ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
      - name: Install GUI dependencies
        run: |
          python -m pip install -c requirements-build.txt "PySide6>=6.6,<6.12"
          python -c "import sys, PySide6, shiboken6; print(sys.version); print('PySide6', PySide6.__version__, 'Shiboken6', shiboken6.__version__)"
      - name: Offline business and GUI tests
        run: python -B -m unittest discover -s tests -t . -v
      - name: Check version metadata
        shell: python
        run: |
          import ast, pathlib, re
          tree = ast.parse(pathlib.Path('core.py').read_text(encoding='utf-8'))
          version = next(n.value.value for n in tree.body if isinstance(n, ast.Assign)
                         and any(isinstance(t, ast.Name) and t.id == 'APP_VERSION' for t in n.targets))
          project = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          assert re.search(r'^version = "' + re.escape(version) + r'"$', project, re.M), 'Version mismatch'

  # Garde-fou : sur un tag vX.Y.Z, on vérifie que le tag correspond bien à
  # core.APP_VERSION (source unique de vérité). Évite les releases accidentelles
  # ou désynchronisées — la cause de l'ancienne release "sync version" inutile.
  verify:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check tag == core.APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CORE=$(python -c "import re,io; s=open('core.py',encoding='utf-8').read(); print(re.search(r'APP_VERSION\s*=\s*[\"\x27]([^\"\x27]+)', s).group(1))")
          echo "tag=$TAG  core.APP_VERSION=$CORE"
          if [ "$TAG" != "$CORE" ]; then
            echo "::error::Tag v$TAG does not match core.APP_VERSION ($CORE). Bump core.py and re-tag."
            exit 1
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: [verify, tests]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SpoolScribe-windows
          - os: macos-latest
            artifact: SpoolScribe-macos
          - os: ubuntu-latest
            artifact: SpoolScribe-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller spoolscribe.spec --noconfirm

      - name: Verify bundled resources against Git
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess
          from PyInstaller.archive.readers import CArchiveReader
          binary = pathlib.Path('dist') / ('SpoolScribe.exe' if os.name == 'nt' else 'SpoolScribe')
          reader = CArchiveReader(str(binary))
          names = {name.replace('\\', '/'): name for name in reader.toc}
          expected = {p.as_posix(): subprocess.check_output(['git', 'show', 'HEAD:' + p.as_posix()])
                      for folder in ('data', 'scripts', 'orca_profiles')
                      for p in pathlib.Path(folder).rglob('*') if p.is_file()}
          actual = {name for name in names if name.startswith(('data/', 'scripts/', 'orca_profiles/'))}
          assert actual == set(expected), 'Unexpected or missing bundled resources'
          for name, raw in expected.items():
              assert pathlib.Path(name).read_bytes() == raw, f'Checkout changed bytes: {name}'
              assert reader.extract(names[name]) == raw, f'Bundle changed bytes: {name}'
          print(f'Verified {len(expected)} bundled resources against HEAD')

      - name: Package artifact (zip + SHA256)
        shell: bash
        run: |
          cd dist
          # onefile : dist/ contient l'exécutable (ou le .app sur macOS).
          # On zippe tout son contenu pour rester générique entre OS.
          7z a "../${{ matrix.artifact }}.zip" ./* >/dev/null 2>&1 || zip -r "../${{ matrix.artifact }}.zip" ./*
          cd ..
          # Empreinte SHA256 pour que les utilisateurs vérifient l'intégrité.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}.zip" > "${{ matrix.artifact }}.zip.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}.zip" > "${{ matrix.artifact }}.zip.sha256"
          fi
          cat "${{ matrix.artifact }}.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Verify all three archives and checksums
        shell: python
        run: |
          import hashlib, pathlib, zipfile
          root = pathlib.Path('artifacts')
          expected = {f'SpoolScribe-{os}.zip{suffix}'
                      for os in ('windows', 'macos', 'linux') for suffix in ('', '.sha256')}
          files = [p for p in root.rglob('*') if p.is_file()]
          assert len(files) == 6 and {p.name for p in files} == expected, 'Incomplete release assets'
          for archive in root.rglob('*.zip'):
              checksum = archive.with_name(archive.name + '.sha256')
              digest, filename = checksum.read_text().strip().split()
              assert filename.lstrip('*') == archive.name, checksum
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == digest, archive
              with zipfile.ZipFile(archive) as z:
                  assert z.namelist() and z.testzip() is None, archive

      - name: Upload complete draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          body: ${{ steps.changelog.outputs.body }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.zip.sha256

      - name: Verify uploaded assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess, tempfile
          expected = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in pathlib.Path('artifacts').rglob('*') if p.is_file()}
          assert len(expected) == 6, 'Incomplete local release assets'
          tag, repo = os.environ['GITHUB_REF_NAME'], os.environ['GITHUB_REPOSITORY']
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run(['gh', 'release', 'download', tag, '--repo', repo, '--dir', directory], check=True)
              actual = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in pathlib.Path(directory).iterdir() if p.is_file()}
              assert actual == expected, 'Uploaded release assets differ from verified build artifacts'
          subprocess.run(['gh', 'release', 'edit', tag, '--repo', repo, '--draft=false', '--latest'], check=True)
