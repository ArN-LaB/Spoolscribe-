# Dependabot — mises à jour automatiques des dépendances.
# Docs : https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Dépendances Python (PySide6, PyInstaller…) déclarées dans requirements.txt.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
    ignore:
      # PyInstaller 7 refuse l'association onefile + BUNDLE encore utilisée
      # sous Windows/Linux ; migration à faire explicitement, pas par un bot.
      - dependency-name: "pyinstaller"
        versions: [">=7.0"]
      # PySide6/Shiboken 6.12 plantent sous Linux/Python 3.10 (CI-01).
      - dependency-name: "pyside6*"
        versions: [">=6.12"]
      - dependency-name: "shiboken6"
        versions: [">=6.12"]
      # Les majeures des autres dépendances sont revues à la main.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-deps:
        patterns:
          - "*"

  # Actions GitHub utilisées par le workflow de build (.github/workflows/*).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      actions-deps:
        patterns:
          - "*"
